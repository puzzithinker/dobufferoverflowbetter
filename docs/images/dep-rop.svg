<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="ui-monospace, monospace" font-size="12">
  <rect width="640" height="300" fill="#0f1419"/>
  <text x="20" y="28" fill="#e7ecf3" font-size="16">Lab 01 (DEP off) vs Lab 05 (DEP on)</text>
  <rect x="20" y="50" width="280" height="200" rx="8" fill="#1c2430" stroke="#5b8def"/>
  <text x="40" y="80" fill="#5b8def" font-weight="700">DEP OFF</text>
  <text x="40" y="110" fill="#c5d0e0">EIP → JMP ESP</text>
  <text x="40" y="135" fill="#c5d0e0">ESP → stack shellcode</text>
  <text x="40" y="160" fill="#3ecf8e">CPU executes stack bytes</text>
  <text x="40" y="200" fill="#8b9bb4" font-size="11">labs 01–04 teaching path</text>
  <rect x="340" y="50" width="280" height="200" rx="8" fill="#1c2430" stroke="#e0a14a"/>
  <text x="360" y="80" fill="#e0a14a" font-weight="700">DEP ON</text>
  <text x="360" y="110" fill="#c5d0e0">EIP → win() / ROP gadgets</text>
  <text x="360" y="135" fill="#c5d0e0">or ROP → VirtualProtect</text>
  <text x="360" y="160" fill="#c5d0e0">then EIP → stack shellcode</text>
  <text x="360" y="200" fill="#8b9bb4" font-size="11">lab 05 code reuse</text>
</svg>
