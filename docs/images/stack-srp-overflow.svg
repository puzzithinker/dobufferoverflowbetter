<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="ui-monospace, monospace" font-size="13">
  <rect width="520" height="360" fill="#0f1419"/>
  <text x="20" y="28" fill="#e7ecf3" font-size="16">Stack SRP overwrite (x86 teaching view)</text>
  <text x="20" y="50" fill="#8b9bb4" font-size="11">high addresses ▲</text>
  <rect x="120" y="60" width="280" height="40" fill="#1c2430" stroke="#5b8def" stroke-width="2"/>
  <text x="140" y="85" fill="#c5d0e0">saved return address (EIP target)</text>
  <rect x="120" y="100" width="280" height="36" fill="#1c2430" stroke="#7a8494"/>
  <text x="140" y="123" fill="#c5d0e0">saved frame pointer (EBP)</text>
  <rect x="120" y="136" width="280" height="100" fill="#2a1f14" stroke="#e0a14a" stroke-width="2"/>
  <text x="140" y="175" fill="#f0d9a8">local buffer (e.g. response[128])</text>
  <text x="140" y="200" fill="#e0a14a" font-size="12">writes grow this way → overflow</text>
  <path d="M 420 220 L 420 80 L 405 95 M 420 80 L 435 95" fill="none" stroke="#e0a14a" stroke-width="2"/>
  <text x="20" y="270" fill="#8b9bb4" font-size="11">low addresses ▼  (stack grows down)</text>
  <text x="20" y="310" fill="#c5d0e0" font-size="12">When the function RETs, CPU loads the overwritten return address into EIP.</text>
  <text x="20" y="335" fill="#8b9bb4" font-size="11">Lab 01/02/03 — classic stack buffer overflow path</text>
</svg>
